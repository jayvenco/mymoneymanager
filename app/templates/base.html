<!doctype html>
<html lang="nl" data-theme="{{ current_user.theme_preference if current_user.is_authenticated else 'system' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/htmx.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2">Naar inhoud</a>
  {% block body %}{% endblock %}

  {# Toasts #}
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-20 z-50 flex flex-col items-center gap-2 px-4 md:bottom-6" aria-live="polite" role="status"
       x-data="toasts()" @toast.window="add($event.detail)">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div data-flash data-category="{{ category }}" hidden>{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <template x-for="t in items" :key="t.id">
      <div class="pointer-events-auto flex max-w-md items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-white shadow-lg"
           :class="t.category === 'error' ? 'bg-red-600' : (t.category === 'success' ? 'bg-brand-700' : 'bg-slate-800')">
        <span x-text="t.message"></span>
        <template x-if="t.undoUrl">
          <button type="button" class="rounded-lg bg-white/20 px-2 py-1 text-xs font-semibold hover:bg-white/30"
                  :hx-post="t.undoUrl" x-init="htmx.process($el)" @click="dismiss(t.id)">Ongedaan maken</button>
        </template>
      </div>
    </template>
  </div>
</body>
</html>
