{% extends "layout_app.html" %}
{% from "_macros.html" import icon %}
{% block title %}Wachtwoord · {{ app_name }}{% endblock %}
{% block content %}
<a href="{{ url_for('settings.index') }}" class="btn-ghost -ml-3 mb-2">{{ icon('chevron-left') }} Instellingen</a>
<h1 class="mb-5 text-2xl font-bold tracking-tight">Wachtwoord wijzigen</h1>
<form method="post" class="card max-w-md space-y-4" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if error %}<p class="rounded-xl bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-300" role="alert">{{ error }}</p>{% endif %}
  <div><label class="label" for="pw-cur">Huidig wachtwoord</label><input class="input" id="pw-cur" name="current" type="password" autocomplete="current-password" required></div>
  <div><label class="label" for="pw-new">Nieuw wachtwoord (min. 10 tekens)</label><input class="input" id="pw-new" name="new" type="password" autocomplete="new-password" required></div>
  <div><label class="label" for="pw-conf">Herhaal nieuw wachtwoord</label><input class="input" id="pw-conf" name="confirm" type="password" autocomplete="new-password" required></div>
  <button class="btn-primary">Wijzigen</button>
</form>
{% endblock %}
