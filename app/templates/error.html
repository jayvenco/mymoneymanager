{% extends "layout_bare.html" %}
{% block title %}Fout {{ code }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="card text-center">
  <p class="text-5xl font-bold text-brand-700 dark:text-brand-300">{{ code }}</p>
  <p class="mt-3 text-slate-600 dark:text-slate-300">{{ message }}</p>
  <a href="{{ url_for('reports.overview') }}" class="btn-primary mt-6">Terug naar het begin</a>
</div>
{% endblock %}
