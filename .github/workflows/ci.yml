name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test-build (zonder push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: mymoneymanager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Entrypoint-test (PUID/PGID)
        run: tests/entrypoint_test.sh mymoneymanager:ci
